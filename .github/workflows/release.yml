name: Release

# Push a tag like v1.2.3 to build a signed release. The APK goes on a GitHub Release; the AAB
# (for Google Play) and the R8 mapping file are kept as workflow artifacts.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Signed AAB + APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag#v}"
          if [[ ! "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must look like v1.2.3 (got $tag)" >&2; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then echo "minor and patch must be 0-99" >&2; exit 1; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.EMBERFIN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The EMBERFIN_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned release." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release
        env:
          EMBERFIN_KEYSTORE: ${{ runner.temp }}/upload.jks
          EMBERFIN_KEYSTORE_PASSWORD: ${{ secrets.EMBERFIN_KEYSTORE_PASSWORD }}
          EMBERFIN_KEY_ALIAS: ${{ secrets.EMBERFIN_KEY_ALIAS }}
          EMBERFIN_KEY_PASSWORD: ${{ secrets.EMBERFIN_KEY_PASSWORD }}
        # Release builds don't work with the configuration cache (AGP's mergeReleaseNativeLibs), and
        # it would store the signing passwords on disk.
        run: >
          ./gradlew --no-configuration-cache testDebugUnitTest bundleRelease assembleRelease
          -PbuildRoot="$RUNNER_TEMP/build"
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Collect outputs
        run: |
          out="$RUNNER_TEMP/build/app/outputs"
          mkdir dist
          cp "$out/apk/release/app-release.apk" "dist/emberfin-${{ steps.version.outputs.name }}.apk"
          cp "$out/bundle/release/app-release.aab" "dist/emberfin-${{ steps.version.outputs.name }}.aab"
          cp "$out/mapping/release/mapping.txt" "dist/mapping-${{ steps.version.outputs.name }}.txt"
          rm -f "$RUNNER_TEMP/upload.jks"
          # The APK must carry the upload key, never the debug key.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          certs="$("$apksigner" verify --print-certs dist/*.apk)"
          if grep -q "CN=Android Debug" <<< "$certs"; then
            echo "APK is debug-signed" >&2; exit 1
          fi

      - name: Upload AAB and mapping
        uses: actions/upload-artifact@v7
        with:
          name: emberfin-${{ steps.version.outputs.name }}-play
          path: |
            dist/*.aab
            dist/*.txt

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "dist/emberfin-${{ steps.version.outputs.name }}.apk"
          --title "Emberfin ${{ steps.version.outputs.name }}" --generate-notes --verify-tag
