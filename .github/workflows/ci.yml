name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, unit tests, debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Also validates the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Lint, unit tests and assembleDebug
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug -PbuildRoot="$RUNNER_TEMP/build"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            ${{ runner.temp }}/build/*/reports/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: emberfin-debug-apk
          path: ${{ runner.temp }}/build/app/outputs/apk/debug/*.apk
          retention-days: 14
